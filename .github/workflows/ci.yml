name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Immutability & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Database Migration Immutability
        run: npm run check:migrations

      - name: Run Domain & Tax Unit Tests
        run: npm run test

      - name: Run Cloud Native & Security Verification
        run: node scripts/test-cloud-native.cjs

      - name: Build Production Assets
        run: npm run build

      - name: Assert Build Artifacts Exist
        run: |
          test -f dist/index.html || exit 1
          echo "✔ Production build assets verified successfully."
