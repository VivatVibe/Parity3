<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Inner Document with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Sheet -->
    <path d="M140 100 H310 L372 162 V400 C372 406.627 366.627 412 360 412 H140 C133.373 412 128 406.627 128 400 V112 C128 105.373 133.373 100 140 100 Z" fill="url(#docGradient)" />
    <!-- Folded Corner -->
    <path d="M310 100 V162 H372 Z" fill="#cbd5e1" opacity="0.9" />
  </g>

  <!-- Invoice Lines -->
  <rect x="168" y="190" width="100" height="14" rx="7" fill="#4f46e5" />
  <rect x="168" y="230" width="176" height="10" rx="5" fill="#94a3b8" />
  <rect x="168" y="260" width="176" height="10" rx="5" fill="#cbd5e1" />
  <rect x="168" y="290" width="140" height="10" rx="5" fill="#cbd5e1" />

  <!-- Baht Symbol / Check Badge -->
  <circle cx="340" cy="350" r="44" fill="#10b981" />
  <text x="340" y="366" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">฿</text>
</svg>
